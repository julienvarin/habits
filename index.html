<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4a2fc4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Habits" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <title>Habits</title>
</head>
<body>
  <div id="gate" class="gate" style="display:none">
    <form id="gate-form" class="gate-form" novalidate>
      <div class="brand">✓</div>
      <h1 class="gate-title">Habits</h1>
      <p id="gate-hint" class="gate-hint">Sign in with your email. We'll send you a 6-digit code.</p>
      <input id="gate-email" type="email" placeholder="Email" autocomplete="email" inputmode="email" required />
      <input id="gate-code" type="text" placeholder="6-digit code" autocomplete="one-time-code"
             inputmode="numeric" pattern="[0-9]*" maxlength="10" style="display:none" />
      <input id="gate-password" type="password" placeholder="Password" autocomplete="current-password" style="display:none" />
      <button id="gate-btn" type="submit" class="gate-btn">Send code</button>
      <button id="gate-back" type="button" class="gate-link" style="display:none">Use a different email</button>
      <button id="gate-mode" type="button" class="gate-link">Use password instead</button>
      <p id="gate-err" class="gate-err" role="alert"></p>
    </form>
  </div>

  <div id="app" style="display:none">
    <!-- Today: the day at a glance, then the big task, weight, journal and morning feeds -->
    <section id="view-today" class="view active">
      <header class="home-head">
        <div class="home-hi">
          <div id="home-date" class="home-date"></div>
          <h1 id="home-hello" class="home-hello"></h1>
        </div>
        <button id="home-bell" class="round-btn" type="button" aria-label="Notifications"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span id="home-bell-count" class="bell-count" hidden></span></button>
        <button id="home-settings" class="round-btn" type="button" aria-label="Settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
      </header>
      <div id="today-main"></div>
      <div class="sec-head"><h2>Journal</h2></div>
      <div id="view-journal"></div>
      <div id="view-morning"></div>
    </section>

    <section id="view-habits" class="view">
      <header class="page-head"><h1>Habits</h1><button class="round-btn" data-action="add-habit" type="button" aria-label="Add habit"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></header>
      <div id="habits-body"></div>
    </section>

    <section id="view-stats" class="view">
      <header class="page-head"><h1>Stats</h1></header>
      <div id="stats-body"></div>
    </section>

    <section id="view-todo" class="view">
      <header class="page-head"><h1>Todo</h1></header>
      <div id="todo-body"></div>
    </section>

    <section id="view-settings" class="view">
      <header class="page-head"><h1>Settings</h1></header>
      <div id="settings-body"></div>
    </section>

    <!-- Tab bar (Today, Habits, ✓ quick check, Todo, Stats; Settings sits on Today's header) -->
    <nav class="tabbar" role="tablist" aria-label="Views">
      <button class="tab active" data-view="today" role="tab" aria-selected="true" type="button"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10.6 3.5a2.2 2.2 0 0 1 2.8 0l6.6 5.6c.6.5 1 1.2 1 2V19a2 2 0 0 1-2 2h-3.5a1 1 0 0 1-1-1v-4.5a1 1 0 0 0-1-1h-3a1 1 0 0 0-1 1V20a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2v-7.9c0-.8.4-1.5 1-2z"/></svg>Today</button>
      <button class="tab" data-view="habits" role="tab" aria-selected="false" type="button"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22c4 0 7-2.7 7-7 0-3.3-2-6-4-8 0 2.5-1.5 4-3 4.5C12 8 10.5 5 8 2c0 4-3 6.5-3 11 0 5 3 9 7 9z"/></svg>Habits</button>
      <button id="fab" class="tab-fab" type="button" aria-label="Check today's habits"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      <button class="tab" data-view="todo" role="tab" aria-selected="false" type="button"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8 12l3 3 5-6"/></svg>Todo</button>
      <button class="tab" data-view="stats" role="tab" aria-selected="false" type="button"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>Stats</button>
    </nav>

    <!-- Bottom sheet (notifications, quick check, edit todo) -->
    <div id="sheet" class="sheet" hidden>
      <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="sheet-grip"></div>
        <div id="sheet-title" class="sheet-title"></div>
        <div id="sheet-list"></div>
      </div>
    </div>

    <div id="modal-root" role="dialog" aria-modal="true"></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden><span id="toast-msg"></span><button id="toast-act" class="toast-act" type="button" hidden></button></div>
  </div>

  <script>
    (function() {
      // Scripts are inserted with async=false: they download in parallel but
      // still execute in order.
      function load(srcs, done) {
        var left = srcs.length;
        srcs.forEach(function(src) {
          var s = document.createElement('script');
          s.src = src; s.async = false;
          s.onload = function() { if (--left === 0 && done) done(); };
          document.body.appendChild(s);
        });
      }

      load(['config.js', 'supabase.js'], function() {
        window.auth.consumeRedirect();
        if (window.auth.isSignedIn()) start(); else showGate();
      });

      function start() {
        document.getElementById('gate').style.display = 'none';
        document.getElementById('app').style.display = '';
        load(['todos.js', 'journal.js', 'weight.js', 'app.js']);
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function() {});
      }

      // Session revoked/expired on the server: back to the sign-in screen.
      window.addEventListener('habits:signedout', function() { location.reload(); });

      function showGate() {
        var gate  = document.getElementById('gate');
        var form  = document.getElementById('gate-form');
        var email = document.getElementById('gate-email');
        var code  = document.getElementById('gate-code');
        var btn   = document.getElementById('gate-btn');
        var back  = document.getElementById('gate-back');
        var hint  = document.getElementById('gate-hint');
        var pass  = document.getElementById('gate-password');
        var mode  = document.getElementById('gate-mode');
        var err   = document.getElementById('gate-err');
        var step  = 'email';
        gate.style.display = '';
        email.value = localStorage.getItem('habits.lastEmail') || '';

        function setStep(next) {
          step = next;
          code.style.display  = step === 'code' ? '' : 'none';
          pass.style.display  = step === 'password' ? '' : 'none';
          back.style.display  = step === 'code' ? '' : 'none';
          mode.style.display  = step === 'code' ? 'none' : '';
          mode.textContent    = step === 'password' ? 'Email me a code instead' : 'Use password instead';
          email.disabled      = step === 'code';
          btn.textContent     = step === 'email' ? 'Send code' : 'Sign in';
          hint.textContent    = step === 'code' ? 'Enter the code we emailed to ' + email.value.trim() + '.'
            : step === 'password' ? 'Sign in with your email and password.'
            : "Sign in with your email. We'll send you a 6-digit code.";
          (step === 'code' ? code : step === 'password' && email.value ? pass : email).focus();
        }

        mode.addEventListener('click', function() { err.textContent = ''; setStep(step === 'password' ? 'email' : 'password'); });

        back.addEventListener('click', function() { err.textContent = ''; code.value = ''; setStep('email'); });

        form.addEventListener('submit', function(e) {
          e.preventDefault();
          err.textContent = '';
          var addr = email.value.trim();
          if (!addr) { err.textContent = 'Enter your email.'; return; }
          btn.disabled = true;
          localStorage.setItem('habits.lastEmail', addr);
          var p = step === 'email'
            ? window.auth.sendCode(addr).then(function() { setStep('code'); })
            : step === 'password'
              ? window.auth.signInWithPassword(addr, pass.value).then(start)
              : window.auth.verifyCode(addr, code.value.replace(/\s/g, '')).then(start);
          p.catch(function(ex) {
            err.textContent = step === 'email' && /signups not allowed|not found/i.test(ex.message)
              ? 'This email has no account.'
              : /rate limit/i.test(ex.message)
                ? 'Too many emails sent (Supabase allows a few per hour). Use your password instead, or try again later.'
                : ex.message;
          }).then(function() { btn.disabled = false; });
        });
      }
    })();
  </script>
</body>
</html>
