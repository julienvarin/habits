name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject config from secrets
        run: |
          cat > config.js << 'SCRIPT'
          window.SUPABASE_URL = "${{ secrets.SUPABASE_URL }}";
          window.SUPABASE_ANON_KEY = "${{ secrets.SUPABASE_ANON_KEY }}";
          window.JULIEN_CALENDAR_ICAL_URL = "${{ secrets.JULIEN_CALENDAR_ICAL_URL }}";
          window.DISCOGS_USERNAME = "${{ secrets.DISCOGS_USERNAME }}";
          window.DISCOGS_TOKEN = "${{ secrets.DISCOGS_TOKEN }}";
          SCRIPT

      # Optional: deploy the Morning-tab proxy (calendar + RSS) as a Supabase
      # Edge Function. Runs only once the SUPABASE_ACCESS_TOKEN secret exists
      # (supabase.com → Account → Access Tokens). Never blocks the Pages deploy.
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        continue-on-error: true
      - name: Deploy morning-proxy edge function
        if: env.SUPABASE_ACCESS_TOKEN != ''
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          ICAL_URL: ${{ secrets.JULIEN_CALENDAR_ICAL_URL }}
        run: |
          REF=$(echo "$SUPABASE_URL" | sed -E 's#https://([^.]+)\..*#\1#')
          supabase secrets set --project-ref "$REF" ICAL_URL="$ICAL_URL"
          supabase functions deploy morning-proxy --project-ref "$REF" --no-verify-jwt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
