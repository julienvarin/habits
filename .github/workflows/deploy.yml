name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SUPABASE_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject config from secrets
        run: |
          cat > config.js << 'SCRIPT'
          window.SUPABASE_URL = "${{ secrets.SUPABASE_URL }}";
          window.SUPABASE_ANON_KEY = "${{ secrets.SUPABASE_ANON_KEY }}";
          window.DISCOGS_USERNAME = "${{ secrets.DISCOGS_USERNAME }}";
          window.DISCOGS_TOKEN = "${{ secrets.DISCOGS_TOKEN }}";
          SCRIPT

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment

      # Deploys the Supabase functions (morning: calendar, U7, news feeds;
      # reminder: daily push notification) and sets their secrets. Skipped until the SUPABASE_ACCESS_TOKEN secret is added.
      - uses: supabase/setup-cli@v1
        if: env.HAS_SUPABASE_TOKEN == 'true'
        with:
          version: latest

      - name: Deploy Supabase functions
        if: env.HAS_SUPABASE_TOKEN == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          ICAL_URL: ${{ secrets.JULIEN_CALENDAR_ICAL_URL }}
          ALLOWED_ORIGINS: https://${{ github.repository_owner }}.github.io,http://localhost:8000
        run: |
          REF=$(echo "$SUPABASE_URL" | sed -E 's#^https://([^.]+)\..*#\1#')
          supabase functions deploy --project-ref "$REF" --no-verify-jwt --use-api
          if [ -n "$ICAL_URL" ]; then
            supabase secrets set --project-ref "$REF" ICAL_URL="$ICAL_URL" ALLOWED_ORIGINS="$ALLOWED_ORIGINS"
          else
            supabase secrets set --project-ref "$REF" ALLOWED_ORIGINS="$ALLOWED_ORIGINS"
          fi
