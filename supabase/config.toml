# Only the bits the habits app uses. See supabase/functions/morning/index.ts.
project_id = "habits"

[functions.morning]
# The function checks the caller's session itself (is_owner()), so the
# gateway check is off; it also wouldn't accept non-JWT publishable keys.
verify_jwt = false

[functions.reminder]
# Called by pg_cron without a user session; see the function header.
verify_jwt = false
